name: "Build and Deploy"
on:
  push:
    branches:
      - main
      - master
    # An allowlist, not a denylist: a change that matters must name its path
    # here. Figures are the case that made this necessary -- they live under
    # femtochat/, which the old paths-ignore dropped wholesale, so regenerating
    # a plot never triggered a deploy and the site kept serving the old image.
    paths:
      - "**"
      - "!femtochat/**"
      - "!docs/**"
      - "!tools/**"
      - "!_drafts/**"
      - "!.gitignore"
      - "!README.md"
      - "!LICENSE"
      # ...except a post's plots, which the site publishes.
      - "femtochat/**/output/figures/**"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # submodules: true
          # If using the 'assets' git submodule from Chirpy Starter, uncomment above
          # (See: https://github.com/cotes2020/chirpy-starter/tree/main/assets)

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          bundler-cache: true

      # assets/img/femtochat/ is a build product of the post folders, not
      # something a human edits. Copying it here means the published site is
      # built from the committed plots even if the local sync was skipped --
      # the pre-commit hook does the same copy, this is the guarantee.
      - name: Sync post figures
        run: bash tools/sync_kaggle.sh figures

      - name: Build site
        run: bundle exec jekyll b -d "_site${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: "production"

      - name: Test site
        run: |
          bundle exec htmlproofer _site \
            \-\-disable-external \
            \-\-ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
